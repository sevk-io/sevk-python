[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sevk"
version = "1.1.0"
description = "Python SDK for Sevk API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Sevk", email = "dev@sevk.io"}
]
keywords = ["sevk", "email", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.24.0",
    "pygments>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<1.15",
    "pytest>=7.0.0",
    "ruff>=0.8,<1",
    "setuptools>=61.0",
    "types-Pygments>=2.15",
    "wheel>=0.45",
]

[project.urls]
Homepage = "https://sevk.io"
Documentation = "https://docs.sevk.io"
Repository = "https://github.com/sevk-io/sevk-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["sevk*"]

[tool.setuptools.package-data]
sevk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.8"
files = ["sevk", "tests"]
check_untyped_defs = true
follow_imports = "skip"
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
